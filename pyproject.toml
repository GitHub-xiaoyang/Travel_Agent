[project]
name = "travel-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "yyf", email = "1164209031@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dashscope>=1.26.4",
    "langchain~=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core~=1.5.2",
    "langchain-openai~=1.4.1",
    "langgraph~=1.2.10",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic-settings>=2.14.2",
    "python-dotenv~=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
    "tavily-python~=0.7.26",
    "tenacity>=9.1.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools.packages.find]
where = ["."]
include = ["travel_agent*", "tools*", "config*", "utils*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-dir]
"" = "."

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
